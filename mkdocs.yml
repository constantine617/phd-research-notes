site_name: PhD Research Notes
site_description: Research notes on trustworthy LLMs and LVLMs, uncertainty, calibration, and multimodal reasoning.
site_url: https://constantine617.github.io/phd-research-notes/
repo_name: constantine617/phd-research-notes
repo_url: https://github.com/constantine617/phd-research-notes
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
plugins:
  - search
  - tags
markdown_extensions:
  - tables
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
# Public developer fixture, intentionally absent from the main navigation.
not_in_nav: |
  /feature-test.md
nav:
  - Home: index.md
  - Research Overview: research-overview/index.md
  - Foundations: foundations/index.md
  - Hallucination: hallucination/index.md
  - Uncertainty Quantification:
      - uncertainty/index.md
      - Confidence Calibration: calibration/index.md
      - Efficient UQ: efficient-uq/index.md
      - Representation-based UQ: representation-uq/index.md
  - Multimodal Research: multimodal/index.md
  - Paper Notes: papers/index.md
  - Research Log: research-log/index.md
  - Glossary: glossary/index.md
