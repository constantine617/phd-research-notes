site_name: PhD Research Notes
site_description: 围绕可信语言模型、幻觉、不确定性量化、置信度校准与多模态证据的博士研究笔记。
site_url: https://constantine617.github.io/phd-research-notes/
repo_name: constantine617/phd-research-notes
repo_url: https://github.com/constantine617/phd-research-notes
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
plugins:
  - search
  - tags
markdown_extensions:
  - tables
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
nav:
  - 首页: index.md
  - 研究总览:
      - 总览: research-overview/index.md
      - 研究范围: research-overview/research-scope.md
      - 研究路线图: research-overview/research-map.md
      - 研究问题: research-overview/research-questions.md
      - 当前研究重点: research-overview/current-focus.md
  - 基础知识:
      - 总览: foundations/index.md
      - 语言模型:
          - 总览: foundations/language-models/index.md
          - 自回归生成: foundations/language-models/autoregressive-generation.md
          - Token 与序列概率: foundations/language-models/token-sequence-probability.md
          - 解码与 Sampling: foundations/language-models/decoding-sampling.md
          - 内部表征: foundations/language-models/hidden-representations.md
      - 概率与信息论:
          - 总览: foundations/probability-information-theory/index.md
          - 概率与似然: foundations/probability-information-theory/probability-likelihood.md
          - 熵: foundations/probability-information-theory/entropy.md
          - 交叉熵: foundations/probability-information-theory/cross-entropy.md
          - 负对数似然: foundations/probability-information-theory/negative-log-likelihood.md
          - KL 散度: foundations/probability-information-theory/kl-divergence.md
      - 视觉语言模型:
          - 总览: foundations/vision-language-models/index.md
          - 大型视觉语言模型: foundations/vision-language-models/lvlm-overview.md
          - 多模态表征: foundations/vision-language-models/multimodal-representation.md
          - 跨模态对齐: foundations/vision-language-models/cross-modal-alignment.md
          - 视觉定位: foundations/vision-language-models/visual-grounding.md
  - 可信性与幻觉:
      - 总览: hallucination/index.md
      - 模型可信性: hallucination/trustworthiness-overview.md
      - 事实性: hallucination/factuality.md
      - 忠实性: hallucination/faithfulness.md
      - 鲁棒性: hallucination/robustness.md
      - 幻觉定义: hallucination/hallucination-definition.md
      - 幻觉分类: hallucination/hallucination-taxonomy.md
      - 成因与失败表现: hallucination/causes-failure-modes.md
      - 幻觉检测: hallucination/detection.md
      - 幻觉缓解: hallucination/mitigation.md
      - 正确性与可靠性: hallucination/reliability-correctness.md
  - 不确定性量化:
      - 总览: uncertainty/index.md
      - UQ 总览: uncertainty/uq-overview.md
      - UQ 分类: uncertainty/uq-taxonomy.md
      - 概念基础:
          - LLM 中的不确定性: uncertainty/foundations/uncertainty-in-llms.md
          - 认知与数据不确定性: uncertainty/foundations/epistemic-aleatoric.md
          - 置信度与不确定性: uncertainty/foundations/confidence-vs-uncertainty.md
          - 不确定性与正确性: uncertainty/foundations/uncertainty-vs-correctness.md
      - 基于概率的 UQ: uncertainty/probability-based/index.md
      - Sampling 方法:
          - 总览: uncertainty/sampling-based/index.md
          - 自一致性: uncertainty/sampling-based/self-consistency.md
          - 预测熵: uncertainty/sampling-based/predictive-entropy.md
          - 语义熵: uncertainty/sampling-based/semantic-entropy.md
      - 语言自报置信度: uncertainty/verbal-confidence/index.md
      - 置信度校准:
          - 总览: calibration/index.md
          - 校准方法: calibration/calibration-methods.md
          - 后处理校准: calibration/post-hoc-calibration.md
      - 高效 UQ: efficient-uq/index.md
      - 基于表征的 UQ:
          - 总览: representation-uq/index.md
          - hidden state 与不确定性: representation-uq/hidden-state-uncertainty.md
      - 证据感知 UQ: uncertainty/evidence-aware/index.md
  - 评估与 Benchmark:
      - 总览: evaluation/index.md
      - 参考真值:
          - 总览: evaluation/ground-truth/index.md
          - 正确性判定: evaluation/ground-truth/correctness-definition.md
          - 幻觉标签: evaluation/ground-truth/hallucination-labels.md
          - 语义等价: evaluation/ground-truth/semantic-equivalence.md
          - 人工评价: evaluation/ground-truth/human-evaluation.md
          - LLM-as-a-Judge: evaluation/ground-truth/llm-as-a-judge.md
      - 检测指标:
          - 总览: evaluation/detection-metrics/index.md
          - AUROC: evaluation/detection-metrics/auroc.md
          - AUPRC: evaluation/detection-metrics/auprc.md
          - 阈值指标: evaluation/detection-metrics/threshold-metrics.md
      - 校准指标:
          - 总览: evaluation/calibration-metrics/index.md
          - ECE: evaluation/calibration-metrics/expected-calibration-error.md
          - Brier Score: evaluation/calibration-metrics/brier-score.md
      - 选择性预测:
          - 总览: evaluation/selective-prediction/index.md
          - Risk-Coverage: evaluation/selective-prediction/risk-coverage.md
          - AURC: evaluation/selective-prediction/aurc.md
      - 基础任务指标: evaluation/basic-task-metrics.md
      - 效率指标: evaluation/efficiency-metrics.md
      - 实验协议:
          - 总览: evaluation/experimental-protocols/index.md
          - 模型选择: evaluation/experimental-protocols/model-selection.md
          - Sampling 设置: evaluation/experimental-protocols/sampling-settings.md
          - 可复现性: evaluation/experimental-protocols/reproducibility.md
          - 统计报告: evaluation/experimental-protocols/statistical-reporting.md
      - Benchmark 选择:
          - 总览: evaluation/benchmarks/index.md
          - 文本 LLM: evaluation/benchmarks/text-llm-benchmarks.md
          - LVLM: evaluation/benchmarks/lvlm-benchmarks.md
          - 幻觉与事实核查: evaluation/benchmarks/hallucination-benchmarks.md
          - 医学: evaluation/benchmarks/medical-benchmarks.md
  - 多模态可信性:
      - 总览: multimodal/index.md
      - LVLM 幻觉: multimodal/lvlm-hallucination.md
      - 多模态不确定性: multimodal/multimodal-uncertainty.md
      - 跨模态一致性: multimodal/cross-modal-consistency.md
      - 视觉定位与可信性: multimodal/grounding-for-trustworthiness.md
      - 基于视觉支持的置信度: multimodal/grounding-based-confidence.md
      - 多模态证据: multimodal/multimodal-evidence.md
  - 医学 AI 应用:
      - 总览: medical/index.md
      - 医学 LVLM: medical/medical-lvlms.md
      - 医学幻觉: medical/medical-hallucination.md
      - 临床可靠性研究: medical/clinical-reliability.md
      - 医学评价: medical/medical-evaluation.md
  - 论文笔记:
      - 总览: papers/index.md
      - Guo 2017 · 置信度校准: papers/2017-guo-calibration.md
      - Tian 2023 · 语言自报置信度: papers/2023-tian-verbal-confidence.md
      - Wang 2023 · 自一致性: papers/2023-wang-self-consistency.md
      - Kuhn 2023 · 语义不确定性: papers/2023-kuhn-semantic-uncertainty.md
      - Farquhar 2024 · 语义熵: papers/2024-farquhar-semantic-entropy.md
      - Manakul 2023 · SelfCheckGPT: papers/2023-manakul-selfcheckgpt.md
      - Azaria 2023 · 内部表征: papers/2023-azaria-internal-state.md
      - Kossen 2024 · 语义熵探针: papers/2024-kossen-semantic-entropy-probes.md
      - Min 2023 · FActScore: papers/2023-min-factscore.md
      - Li 2023 · POPE: papers/2023-li-pope.md
      - Khan 2024 · 一致性与不确定性: papers/2024-khan-consistency-uncertainty.md
      - Favero 2024 · M3ID: papers/2024-favero-m3id.md
      - Li 2023 · LLaVA-Med: papers/2023-li-llava-med.md
      - Yu 2023 · 放射报告评价: papers/2023-yu-radiology-evaluation.md
  - 研究成果: research-outputs/index.md
  - 研究日志: research-log/index.md
  - 术语表: glossary/index.md
